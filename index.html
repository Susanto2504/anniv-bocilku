<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Happy 3rd Anniversary</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        pink: {
                            50: '#fdf2f8',
                            100: '#fce7f3',
                            200: '#fbcfe8',
                            300: '#f9a8d4',
                            400: '#f472b6',
                            500: '#ec4899',
                            600: '#db2777',
                            700: '#be185d',
                            800: '#9d174d',
                            900: '#831843',
                        }
                    },
                    fontFamily: {
                        'script': ['"Dancing Script"', 'cursive'],
                        'sans': ['Poppins', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        /* Mencegah scrolling global */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-color: #fce7f3; /* pink-100 */
        }
        
        .page-container {
            height: 100vh;
            /* menggunakan dvh agar tinggi stabil di mobile */
            height: 100dvh; 
            width: 100vw;
            position: absolute;
            top: 0;
            left: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        /* Foto agak dikurangi ukurannya agar teks panjang muat */
        .img-container {
            max-height: 28vh; 
            max-width: 90vw;
            object-fit: cover;
            border-radius: 1rem;
            box-shadow: 0 10px 25px -5px rgba(236, 72, 153, 0.5);
            border: 4px solid white;
        }
        
        /* Custom scrollbar untuk kotak teks jika kata-katanya sangat panjang */
        .text-scroll::-webkit-scrollbar {
            width: 4px;
        }
        .text-scroll::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.2); 
            border-radius: 4px;
        }
        .text-scroll::-webkit-scrollbar-thumb {
            background: rgba(236, 72, 153, 0.4); 
            border-radius: 4px;
        }
    </style>
    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('anniversary', () => ({
                page: 1,
                maxPages: 20,
                isPlaying: false,
                audio: null,
                memories: [
                    {
                        title: "This Moment",
                        img: "img/WhatsApp Image 2026-03-17 at 10.19.11.jpeg",
                        p1: "Aku masih ingat dengan sangat jelas hari pertama di mana kita akhirnya memutuskan untuk menggenggam tangan satu sama lain.",
                        p2: "Semuanya terasa mendebarkan, tapi entah kenapa bersamamu rasanya sangat amat menyenangkan. Mulai dari obrolan ringan sampai hal-hal lucu yang kita tertawakan bersama, aku tidak akan pernah melupakan hal itu."
                    },
                    {
                        title: "Dalam Setiap Perjalanan Kita",
                        img: "img/Foto 1.jpg",
                        p1: "Tentu saja kita tidak selalu menemui hari yang cerah. Terkadang ada rasa lelah, kesal, bahkan pertengkaran kecil yang mewarnai hari-hari kita.",
                        p2: "Tapi satu hal yang aku yakini selama kita mau saling mendengarkan, kita akan selalu baik-baik saja. Bahumu adalah tempat paling nyaman bagiku untuk bersandar saat duniaku terasa berat."
                    },
                    {
                        title: "Langkah Kita",
                        img: "img/WhatsApp Image 2026-03-17 at 10.22.20.jpeg",
                        p1: "Terima kasih banyak... sudah mau bertahan dengan segala kekuranganku, sifat kerasku, dan betapa menyebalkannya diriku terkadang.",
                        p2: "Mari kita ciptakan lebih banyak memori. Mengejar mimpi kita satu per satu, sambil terus berpegangan hingga menua bersama. Kamu adalah jawaban atas doa-doaku."
                    },
                    {
                        title: "Senyum Manismu",
                        img: "img/WhatsApp Image 2026-03-24 at 07.58.10.jpeg",
                        p1: "Setiap kali melihat senyummu, rasanya seluruh beban di pundakku menghilang begitu saja.",
                        p2: "Senyummu adalah obat paling manjur untuk hari-hariku yang lelah. Tolong jangan pernah berhenti tersenyum untukku yaa sayangg."
                    },
                    {
                        title: "Tempat Pulang",
                        img: "img/WhatsApp Image 2026-03-24 at 07.30.48.jpeg",
                        p1: "Banyak hal yang berjalan tak sesuai rencana, dari rencana jalan-jalan kita yang sering batal hingga pekerjaan, tugas kuliah yang bikin pusing.",
                        p2: "Namun, seberat apapun hariku, mengingat bahwa aku mengejar cita-cita kita untuk bersama selamanya selalu memberiku kekuatan yang tak terbatas."
                    },
                    {
                        title: "Kejutan Kecil",
                        img: "img/WhatsApp Image 2026-03-24 at 07.34.41.jpeg",
                        p1: "Hal yang paling aku suka adalah saat kamu mengingat hal-hal kecil tentangku yang bahkan terkadang aku sendiri melupakannya.",
                        p2: "Mulai dari kesehatanku, makanan kesukaanku, dan warna yang aku suka, kamu dengan tulus memperhatikan segalanya."
                    },
                    {
                        title: "Lebih Dari Cukup",
                        img: "img/WhatsApp Image 2026-03-24 at 07.36.58.jpeg",
                        p1: "Dulu aku sering bertanya-tanya seperti apa rasanya dicintai dengan sedemikian hebat tanpa syarat.",
                        p2: "Sekarang aku tak perlu bertanya lagi, karena berada di dekatmu telah menjawab semua rasa penasaran itu. Dirimu sudah lebih dari cukup."
                    },
                    {
                        title: "Canda Kita",
                        img: "img/WhatsApp Image 2026-03-24 at 07.40.27.jpeg",
                        p1: "Banyak waktu kita habiskan dengan tertawa pada hal-hal bodoh yang tidak dimengerti orang lain.",
                        p2: "Hanya lewat tatapan mata, kita seringkali sudah sepaham tentang sesuatu. Kekonyolan ini yang memperkuat cinta di antara kita."
                    },
                    {
                        title: "Menjadi Diriku Sepenuhnya",
                        img: "img/WhatsApp Image 2026-03-24 at 07.41.57.jpeg",
                        p1: "Saat bersamamu, aku tidak perlu lagi memakai topeng untuk menutupi segudang kekuranganku.",
                        p2: "Karena bersamamu aku bisa menjadi diriku yang apa adanya, karena aku tahu kamu akan tetap menerimaku apa adanya."
                    },
                    {
                        title: "Menyelami Duniamu",
                        img: "img/WhatsApp Image 2026-03-24 at 07.48.25.jpeg",
                        p1: "Melihatmu bersemangat membicarakan hobi atau hal yang kamu senangi adalah salah satu pemandangan favoritku.",
                        p2: "Matamu yang bersemangat saat menceritakan hal yang kamu sukai sangatlah memesona. Aku ingin terus mendengarkan ceritamu seumur hidupku."
                    },
                    {
                        title: "Kesabaranmu",
                        img: "img/WhatsApp Image 2026-03-24 at 07.50.27.jpeg",
                        p1: "Aku sadar kadang-kadang aku membuat kamu sangat jengkel karena suka ngeledek kamu dan keras kepala.",
                        p2: "Namun kesabaran yang kamu tunjukkan sungguh luar biasa. Maafkan aku yaa jika aku merepotkan dan terima kasih karena kamu tidak pernah menyerah pada hubungan kita."
                    },
                    {
                        title: "Saling Melengkapi",
                        img: "img/WhatsApp Image 2026-03-24 at 07.53.09.jpeg",
                        p1: "Kekuranganku menjadi kelebihanmu, dan begitupun sebaliknya. Kita adalah dua orang dengan latar belakang yang berbeda namun menyatu dengan sempurna berkat cinta dan kasih sayang satu sama lain.",
                        p2: "Sekarang aku menatap masa depan tidak lagi dengan ketakutan, melainkan dengan semangat yang membara karena kamu ada bersamaku dan menggenggam tanganku."
                    },
                    {
                        title: "Satu Frekuensi",
                        img: "img/WhatsApp Image 2026-03-24 at 07.56.07.jpeg",
                        p1: "Terkadang kita tidak sefrekuensi, tapi aku yakin kita sama-sama berusaha untuk saling mengerti dan memahami satu sama lain.",
                        p2: "karena aku tahu kamu juga mencintaiku sama seperti aku mencintaimu."
                    },
                    {
                        title: "Mengukir Cerita",
                        img: "img/WhatsApp Image 2026-03-24 at 07.25.29.jpeg",
                        p1: "Selembar demi selembar terus kita isi dengan puluhan bahkan ratusan cerita cinta kita yang dipenuhi tawa dan kebahagiaan, duka dan air mata.",
                        p2: "Tapi aku sangat bersyukur karena cerita itu semua kulalui bersamamu."
                    },
                    {
                        title: "Banyaknya Keindahan",
                        img: "img/WhatsApp Image 2026-03-24 at 08.02.03.jpeg",
                        p1: "aku baru sadar, ternyata dunia ini terasa jauh lebih indah jika kita menikmatinya bersama seseorang yang memang ditakdirkan untuk kita.",
                        p2: "Dan di antara miliaran manusia di muka bumi ini, aku tak henti-hentinya merasa sebagai orang paling beruntung karena kamu yang berada di sisiku."
                    },
                    {
                        title: "Janji Sederhana",
                        img: "img/WhatsApp Image 2026-03-24 at 08.03.41.jpeg",
                        p1: "Aku tidak menjanjikan hubungan kita akan selalu mulus dan tanpa tantangan.",
                        p2: "Namun aku berjanji, sebanyak apa pun masalah yang menimpa kita, tanganku akan selalu siap menemanimu berdiri dan melewatinya bersama, hingga badai itu selesai."
                    },
                    {
                        title: "Segenap Hatiku",
                        img: "img/WhatsApp Image 2026-03-24 at 08.06.28.jpeg",
                        p1: "Aku mencintaimu lebih dari kata-kata yang bisa kuungkapkan dan aku akan selalu ada untukmu.",
                        p2: "Tiga tahun ini mungkin kamu sudah sangat hafal dengan sifatku, kebiasaanku, dan lain sebagainya, tapi aku harap kamu tidak akan pernah bosan denganku."
                    },
                    {
                        title: "Yang Terbaik",
                        img: "img/WhatsApp Image 2026-03-24 at 08.08.08.jpeg",
                        p1: "Teruslah berada di sampingku, menggenggam tanganku dengan erat, dan terus berjalan bersamaku.",
                        p2: "Untuk seribu tahun dan miliaran kemungkinan lainnya, kamulah segala hal yang kuminta dan yang selalu kusebut dalam doaku di setiap heningnya malam."
                    }
                ],
                getAnimations(index) {
                    const anims = ['animate__fadeInRight', 'animate__fadeInUp', 'animate__zoomIn', 'animate__fadeInLeft'];
                    return anims[index % anims.length];
                },
                init() {
                    // Masukkan file musik kalian bernama music.mp3 ke folder d:\Anniv
                    this.audio = new Audio('img/Afgan & Raisa - Percayalah.mp3'); 
                    this.audio.loop = true;
                },
                playMusic() {
                    if (!this.isPlaying) {
                        this.audio.play().then(() => {
                            this.isPlaying = true;
                        }).catch((e) => {
                            console.log('Autoplay ditahan oleh browser sampai ada interaksi.');
                        });
                    }
                },
                toggleMusic() {
                    if (this.isPlaying) {
                        this.audio.pause();
                        this.isPlaying = false;
                    } else {
                        this.audio.play();
                        this.isPlaying = true;
                    }
                }
            }))
        })
    </script>
</head>
<body class="font-sans text-gray-800 antialiased" x-data="anniversary()" x-init="playMusic()">

    <!-- Tombol Background Music -->
    <button @click="toggleMusic()" class="fixed top-4 left-4 z-50 bg-white/60 hover:bg-white/90 p-3 rounded-full shadow-lg backdrop-blur-md transition-all text-pink-500">
        <svg x-show="isPlaying" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 animate-pulse" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c-1.105 0-2-.895-2-2s.895-2 2-2 2 .895 2 2-.895 2-2 2zm12-3c-1.105 0-2-.895-2-2s.895-2 2-2 2 .895 2 2-.895 2-2 2zM9 10l12-3" />
        </svg>
        <svg x-show="!isPlaying" style="display: none;" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 opacity-60" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.907L5.586 15z" clip-rule="evenodd" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2" />
        </svg>
    </button>

    <!-- Animasi Background Hiasan -->
    <div class="fixed inset-0 z-0 overflow-hidden pointer-events-none">
        <div class="absolute -top-20 -left-20 w-72 h-72 bg-pink-300 rounded-full mix-blend-multiply filter blur-3xl opacity-60 animate-pulse"></div>
        <div class="absolute top-1/2 -right-20 w-80 h-80 bg-pink-400 rounded-full mix-blend-multiply filter blur-3xl opacity-50 animate-pulse" style="animation-delay: 2s;"></div>
        <div class="absolute -bottom-32 left-1/3 w-96 h-96 bg-pink-200 rounded-full mix-blend-multiply filter blur-3xl opacity-60 animate-pulse" style="animation-delay: 4s;"></div>
    </div>

    <!-- Wrapper Navigasi Halaman -->
    <div class="relative z-10 w-full h-full overflow-hidden">
        
        <!-- Halaman 1: Intro -->
        <template x-if="page === 1">
            <div class="page-container p-4 sm:p-6 animate__animated animate__fadeIn"
                 x-transition:enter="transition ease-out duration-700 delay-300"
                 x-transition:enter-start="opacity-0 scale-90"
                 x-transition:enter-end="opacity-100 scale-100">
                <div class="glass-panel p-6 md:p-12 rounded-3xl text-center max-w-lg w-full flex flex-col items-center justify-center h-[90vh] sm:h-[88vh] shadow-2xl">
                    <div class="text-pink-500 mb-4 animate__animated animate__heartBeat animate__infinite animate__slower">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 md:h-20 md:w-20 mx-auto" fill="currentColor" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                    </div>
                    <h1 class="font-script text-5xl md:text-7xl text-pink-600 mb-2 leading-tight drop-shadow-sm">Happy 3rd<br>Anniversary Sayangku</h1>
                    <p class="text-base md:text-lg text-pink-800 mb-8 mt-4 font-light px-2 tracking-wide leading-relaxed">Tiga tahun yang lalu kita memutuskan untuk memulai cerita ini. Sebuah perjalanan indah yang penuh tawa, cinta, dan berjuta kenangan manis buatku.</p>
                    <button @click="page = 2; playMusic()" class="bg-gradient-to-r from-pink-500 to-pink-600 hover:from-pink-600 hover:to-pink-700 text-white font-semibold py-3 px-8 rounded-full shadow-lg transform transition hover:scale-105 active:scale-95 flex items-center space-x-2">
                        <span>Baca Pesanku</span>
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z" clip-rule="evenodd" /></svg>
                    </button>
                </div>
            </div>
        </template>

        <!-- Halaman 2 hingga 19: Generated dari Array Memories -->
        <template x-for="(memory, index) in memories" :key="index">
            <template x-if="page === index + 2">
                <div class="page-container p-4 sm:p-6 animate__animated" :class="getAnimations(index)">
                    <div class="glass-panel p-5 md:p-8 rounded-3xl flex flex-col items-center justify-between h-[90vh] sm:h-[88vh] w-full max-w-md shadow-2xl relative overflow-hidden">
                        
                        <!-- Page Indicator -->
                        <div class="absolute top-3 right-4 text-xs font-bold text-pink-400 bg-white/70 px-2 py-1 rounded-full shadow-sm">
                            <span x-text="(index + 2) + '/' + maxPages"></span>
                        </div>

                        <h2 class="font-script text-3xl md:text-4xl text-pink-600 mb-2 tracking-wide text-center pt-3 md:pt-4" x-text="memory.title"></h2>
                        <div class="flex items-center justify-center w-full relative mb-3">
                            <img :src="memory.img" alt="Foto Kenangan" class="img-container w-full object-cover">
                        </div>
                        <div class="flex-grow text-center text-pink-900 mt-1 mb-4 px-2 overflow-y-auto text-scroll">
                            <p class="text-[0.85rem] md:text-[0.95rem] leading-relaxed md:leading-loose font-medium mb-3" x-text="memory.p1"></p>
                            <p class="text-[0.85rem] md:text-[0.95rem] leading-relaxed md:leading-loose" x-text="memory.p2"></p>
                        </div>
                        <div class="flex justify-between w-full mt-1">
                            <button @click="page--" class="text-pink-600 hover:text-pink-800 bg-white/70 hover:bg-white p-3 rounded-full transition-colors shadow-sm">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 md:h-6 md:w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" /></svg>
                            </button>
                            <button @click="page++" class="bg-gradient-to-r from-pink-500 to-pink-600 hover:from-pink-600 hover:to-pink-700 text-white font-medium py-2 px-6 rounded-full shadow-lg transform transition hover:scale-105 active:scale-95 flex items-center space-x-2 text-sm md:text-base">
                                <span x-text="index === memories.length - 1 ? 'Halaman Terakhir' : 'Lanjut Baca'"></span>
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 md:h-5 md:w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z" clip-rule="evenodd" /></svg>
                            </button>
                        </div>
                    </div>
                </div>
            </template>
        </template>

        <!-- Halaman 20: Outro (Halaman Terakhir) -->
        <template x-if="page === maxPages">
            <div class="page-container p-4 sm:p-6 animate__animated animate__fadeIn border-4 border-transparent">
                <div class="glass-panel p-8 md:p-12 rounded-3xl text-center max-w-lg w-full flex flex-col items-center justify-center h-[90vh] sm:h-[88vh] shadow-2xl relative overflow-hidden">
                    
                    <div class="absolute top-3 right-4 text-xs font-bold text-pink-400 bg-white/70 px-2 py-1 rounded-full shadow-sm z-20">
                        <span x-text="maxPages + '/' + maxPages"></span>
                    </div>

                    <!-- Hiasan Hati Melayang -->
                    <div class="absolute inset-0 rounded-3xl pointer-events-none">
                        <div class="absolute top-10 left-10 text-2xl md:text-4xl text-pink-400 opacity-60 animate__animated animate__bounce animate__infinite animate__slower delay-75">❤️</div>
                        <div class="absolute bottom-20 right-10 text-3xl md:text-5xl text-pink-500 opacity-70 animate__animated animate__pulse animate__infinite" style="animation-duration: 3s">💖</div>
                        <div class="absolute top-1/3 right-1/4 text-xl md:text-3xl text-pink-300 opacity-50 animate__animated animate__swing animate__infinite delay-150">💕</div>
                        <div class="absolute bottom-1/3 left-1/4 text-2xl md:text-4xl text-pink-400 opacity-60 animate__animated animate__heartBeat animate__infinite">💗</div>
                    </div>

                    <h1 class="font-script text-6xl md:text-8xl text-pink-600 mb-6 relative z-10 animate__animated animate__tada animate__delay-1s drop-shadow-md">I Love You!</h1>
                    <p class="text-xl md:text-2xl text-pink-800 mb-6 font-medium relative z-10 px-4">Selamat Hari Jadi Kita yang ke-3, Sayangku!</p>
                    <p class="text-sm md:text-base text-pink-900 mb-10 font-light relative z-10 px-4 italic">"I love you more than any words can say. Forever and always."</p>

                    <div class="flex space-x-4 relative z-10">
                        <button @click="page--" class="bg-white border-2 border-pink-400 text-pink-600 hover:bg-pink-50 font-medium p-3 rounded-full shadow-lg transform transition hover:scale-105 active:scale-95">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" /></svg>
                        </button>
                        <button @click="page = 1" class="bg-white border-2 border-pink-400 text-pink-600 hover:bg-pink-50 font-semibold py-3 px-8 rounded-full shadow-lg transform transition hover:scale-105 active:scale-95 flex items-center space-x-2">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>
                            <span>Ulangi Kembali</span>
                        </button>
                    </div>
                </div>
            </div>
        </template>

    </div>

</body>
</html>
